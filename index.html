<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>合成大西瓜 - 雲端連線版</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2>🍉 合成大西瓜</h2>
            <div class="tabs">
                <button id="tab-login" class="active" onclick="switchTab('login')">登入</button>
                <button id="tab-register" onclick="switchTab('register')">註冊</button>
            </div>
            <form onsubmit="handleAuth(event)">
                <input type="text" id="username" placeholder="請輸入帳號" required>
                <input type="password" id="password" placeholder="請輸入密碼" required>
                <button type="submit" id="submit-btn">進入遊戲</button>
            </form>
            <p id="auth-message" style="color: #ff4d4d; margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <div id="game-container" style="display: none;">
        
        <div class="header-info">
            <div class="player-info">
                玩家: <span id="current-user-tag"></span>
            </div>
            <div class="score-info">
                得分: <span id="score">0</span>
            </div>
        </div>

        <div id="leaderboard-box" class="ui-box">
            <h3 onclick="toggleBox('leaderboard-box')" style="cursor: pointer;">🏆 前五名排行榜</h3>
            <ul id="leaderboard-list">
                <li>連線中...</li>
            </ul>
            <button onclick="logout()" class="logout-btn">登出</button>
        </div>

        <div id="hint-box" class="ui-box right-box">
            <h3 onclick="toggleBox('hint-box')" style="cursor: pointer;">進化鏈 ➡️</h3>
            <div class="evolution-chain">
                🍓➡️🍋➡️🍊➡️🍅➡️🍇➡️🍉
            </div>
            <div class="next-fruit" style="margin-top: 8px;">
                下一個: <span id="next-fruit-preview">🍓</span>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    
    <script type="module" src="app.js"></script>
    
</body>
</html>
