<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果合成大對決 PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

    <div id="auth-screen" class="overlay">
        <div class="auth-box">
            <div class="tab-buttons">
                <button id="tab-login" class="active" onclick="switchTab('login')">登入帳號</button>
                <button id="tab-register" onclick="switchTab('register')">註冊帳號</button>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <input type="text" id="username" placeholder="請輸入使用者名稱" required>
                <input type="password" id="password" placeholder="請輸入密碼" required>
                <button type="submit" id="submit-btn">進入遊戲</button>
            </form>
            <p id="auth-message" style="color: #ff7675; margin-top: 15px; font-size: 14px;"></p>
        </div>
    </div>

    <div id="game-container" style="display: none;">
        <div class="header">
            <div>玩家: <span id="current-user-tag">---</span></div>
            <div>得分: <span id="score">0</span></div>
        </div>

        <div id="evolution-chain-box" class="evolution-chain" onclick="toggleBox('evolution-chain-box')">
            <p>進化鍊 🔄</p> 
            <div class="chain-items">
                <span class="chain-dot" style="background:#ff4d4d;" title="草莓">🍓</span>
                <span class="chain-dot" style="background:#ffd700;" title="檸檬">🍋</span>
                <span class="chain-dot" style="background:#ffa500;" title="橘子">🍊</span>
                <span class="chain-dot" style="background:#ff6347;" title="番茄">🍅</span>
                <span class="chain-dot" style="background:#9370db;" title="葡萄">🍇</span>
                <span class="chain-dot" style="background:#2ed573;" title="西瓜">🍉</span>
            </div>
            <div class="next-box">下一個: <span id="next-fruit-preview">🍓</span></div>
        </div>

        <div id="leaderboard-box" class="leaderboard-box" onclick="toggleBox('leaderboard-box')">
            <h3>排行榜 🏆</h3>
            <ol id="leaderboard-list">
                </ol>
        </div>

        <button id="logout-btn" onclick="logout()" class="logout-btn">登出</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
